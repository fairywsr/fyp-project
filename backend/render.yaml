services:
  - type: web
    name: smart-query-routing-backend
    env: python
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SERVICE_API_KEY
        generateValue: true
      - key: AI_CONFIDENCE_THRESHOLD
        value: "0.6"
      - key: ESCALATION_HOURS
        value: "24"
